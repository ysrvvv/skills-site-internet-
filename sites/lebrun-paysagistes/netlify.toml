[build]
  publish = "."

# Maquette : empêche l'indexation par les moteurs de recherche.
# À supprimer à la mise en ligne officielle.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
